# Reusable workflow behind the release and manual job of a library
# repository's check-skills.yml. The caller pins this file to an Intent
# release commit. It needs `contents: write` to push the review branch and
# `pull-requests: write` to open or update the review PR; the caller grants
# exactly those two, on this job alone.
#
# Intent itself runs from the repository's own lockfile-pinned copy, so a
# malicious npm publish does nothing until the maintainer merges a bump. The
# `intent-version` input opts into a registry install instead.

name: Review Skills

on:
  workflow_call:
    inputs:
      package-label:
        description: Package label shown in review reminders, e.g. @tanstack/query
        type: string
        default: ''
      intent-version:
        description: npm dist-tag or version of @tanstack/intent to install instead of the repository's own copy
        type: string
        default: ''
      node-version:
        description: Node.js version for the checks
        type: string
        default: '22'

permissions: {}

jobs:
  review:
    name: Check intent skill coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token is supplied to the one push below, so the installed CLI
          # runs without credentials in the checkout.
          persist-credentials: false

      - name: Detect package manager
        id: manager
        env:
          INTENT_VERSION: ${{ inputs.intent-version }}
        run: |
          cache=''
          if [ -z "$INTENT_VERSION" ]; then
            if [ -f pnpm-lock.yaml ]; then cache=pnpm
            elif [ -f yarn.lock ]; then cache=yarn
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then cache=npm
            fi
          fi
          if [ "$cache" = pnpm ] || [ "$cache" = yarn ]; then corepack enable; fi
          echo "cache=$cache" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.manager.outputs.cache }}

      - name: Install intent
        env:
          INTENT_VERSION: ${{ inputs.intent-version }}
          MANAGER: ${{ steps.manager.outputs.cache }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          if [ -n "$INTENT_VERSION" ]; then
            npm install -g "@tanstack/intent@${INTENT_VERSION}"
            exit 0
          fi
          case "$MANAGER" in
            pnpm) pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn)
              if yarn --version | grep -q '^1\.'; then
                yarn install --frozen-lockfile --ignore-scripts
              else
                yarn install --immutable --mode=skip-build
              fi ;;
            npm) npm ci --ignore-scripts ;;
            *)
              echo "::error::No lockfile found. Commit one, or set the intent-version input to install @tanstack/intent from npm."
              exit 1 ;;
          esac
          if [ ! -e node_modules/.bin/intent ]; then
            echo "::error::@tanstack/intent is not installed in this repository. Add it to devDependencies so CI runs the version the lockfile pins, or set the intent-version input to install it from npm."
            exit 1
          fi
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check skills
        id: stale
        env:
          PACKAGE_LABEL: ${{ inputs.package-label }}
        run: |
          LABEL=()
          if [ -n "$PACKAGE_LABEL" ]; then
            LABEL=(--package-label "$PACKAGE_LABEL")
          fi
          if [ -f .intent/review-state.json ]; then
            intent review --github-review "${LABEL[@]}"
          else
            intent stale --github-review "${LABEL[@]}"
          fi

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || 'manual' }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BRANCH="skills/review-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
          else
            # A remote branch left from an earlier, merged review PR has no
            # commits ahead of the base, so it is recreated from the base.
            git checkout -B "$BRANCH"
            git commit --allow-empty -m "chore: review intent skills for ${VERSION}"
            # Same header actions/checkout would have persisted, scoped to this push.
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH}" \
              push --force origin "$BRANCH"
            gh pr create \
              --title "Review intent skills (${VERSION})" \
              --body-file pr-body.md \
              --head "$BRANCH" \
              --base "$BASE_BRANCH"
          fi
