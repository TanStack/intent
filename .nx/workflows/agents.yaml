distribute-on:
  small-changeset: 3 linux-medium-node24
  medium-changeset: 6 linux-medium-node24
  large-changeset: 10 linux-medium-node24

common-js-init-steps: &common-js-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

  - name: Restore Node Modules Cache
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
    inputs:
      key: 'pnpm-lock.yaml|package.json|pnpm-workspace.yaml|.npmrc'
      paths: 'node_modules'
      base-branch: 'main'

  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'

  - name: Install Node Modules
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml'

  - name: Verify Toolchain
    script: |
      node --version
      pnpm --version
      pnpm nx --version

launch-templates:
  linux-medium-node24:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    init-steps: *common-js-init-steps
