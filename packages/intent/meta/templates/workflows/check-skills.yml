# check-skills.yml — copied by `intent maintainer setup` into .github/workflows/
#
# Validates intent skills and recorded source reviews on pull requests. After a
# release or manual run, opens or updates one review PR when skills, artifact
# coverage, or workspace package coverage need review.
#
# The steps live in TanStack/intent's reusable workflows, pinned below to the
# commit of the Intent release that copied this file. Dependabot and Renovate
# bump the pin like any other action reference; a `github-actions` entry in
# .github/dependabot.yml is enough. Each job grants only the permissions its
# workflow needs, and Intent runs from this repository's own lockfile-pinned
# copy of @tanstack/intent.
#
# intent-workflow-version: 4
#
# Template variables (replaced by `intent setup`):
#   {{PACKAGE_LABEL}} — e.g. @tanstack/query or my-workspace workspace
#   {{INTENT_WORKFLOW_REF}} — the release commit, or its tag when unresolved

name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/check-skills.yml@{{INTENT_WORKFLOW_REF}}

  review:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: TanStack/intent/.github/workflows/review-skills.yml@{{INTENT_WORKFLOW_REF}}
    with:
      package-label: '{{PACKAGE_LABEL}}'
