# check-skills.yml — copied by `intent maintainer setup` into .github/workflows/
#
# Validates intent skills and recorded source reviews on pull requests. After a
# release or manual run, opens or updates one review PR when skills, artifact
# coverage, or workspace package coverage need review.
#
# The checks live in TanStack/intent's reusable workflow, pinned to a major
# tag, so they update with Intent releases without an edit here.
#
# intent-workflow-version: 6
#
# Template variables (replaced by `intent setup`):
#   {{PACKAGE_LABEL}} — e.g. @tanstack/query or my-workspace workspace

name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  skills:
    uses: TanStack/intent/.github/workflows/check-skills.yml@v0
    with:
      package-label: '{{PACKAGE_LABEL}}'
